{% set name = "perl-exception-class" %}
{% set version = "1.46" %}
{% set sha256 = "e2f8c0708ff8de8b1bb7be1faa3cdb240fdd9774bc741627350577ea7e0e76a1" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: https://cpan.metacpan.org/authors/id/D/DR/DROLSKY/Exception-Class-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: generic
  number: 0
  run_exports:
    weak:
      - {{ name }} ={{ version }}

requirements:
  build:
    - make
  host:
    - perl
    - perl-devel-stacktrace
    - perl-class-data-inheritable
  run:
    - perl

test:
  imports:
    - Exception::Class
    - Exception::Class::Base

about:
  home: https://metacpan.org/dist/Exception-Class
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_file: LICENSE
  summary: 'A module that allows you to declare real exception classes in Perl'

extra:
  recipe-maintainers:
    - xileF1337
    - conda-forge/perl-packagers
